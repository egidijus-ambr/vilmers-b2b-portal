<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset PWA Install Prompt</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f4;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #292524;
        }
        p {
            color: #78716c;
            margin-bottom: 1.5rem;
        }
        button {
            background: #78716c;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #57534e;
        }
        .success {
            color: #16a34a;
            font-weight: 500;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset PWA Install Prompt</h1>
        <p>Click below to reset the PWA install popup dismissal. The popup will show again on the next page load.</p>
        <button onclick="resetPWA()">Reset PWA Prompt</button>
        <div id="message"></div>
    </div>

    <script>
        function resetPWA() {
            localStorage.removeItem('pwa-install-dismissed');
            localStorage.removeItem('pwa-install-dismissed-ios');

            const msg = document.getElementById('message');
            msg.innerHTML = '<p class="success">✓ PWA prompt reset! <a href="/">Go to home page</a></p>';

            // Auto redirect after 2 seconds
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }
    </script>
</body>
</html>
